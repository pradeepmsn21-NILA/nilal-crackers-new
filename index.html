<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Cart Order Submission</title>
    <style>
        .cart-container { width: 300px; margin: 20px auto; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .submit-btn { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; width: 100%; }
        .submit-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="cart-container">
    <h3>Your Cart</h3>
    <div id="cart-items">
        <div class="cart-item">
            <span class="product-name">Product A</span>
            <span class="product-price">₹100</span>
        </div>
        <div class="cart-item">
            <span class="product-name">Product B</span>
            <span class="product-price">₹250</span>
        </div>
    </div>
    <hr>
    <!-- Download Button நீக்கப்பட்டு, Submit Order பட்டன் மட்டுமே உள்ளது -->
    <button type="button" class="submit-btn" onclick="submitOrder()">Submit Order</button>
</div>

<script>
async function submitOrder() {
    // Cart-இல் உள்ள பொருட்களை சேகரித்தல்
    const cartItems = [];
    document.querySelectorAll('.cart-item').forEach(item => {
        const name = item.querySelector('.product-name').innerText;
        const priceText = item.querySelector('.product-price').innerText.replace('₹', '');
        cartItems.push({
            product_name: name,
            price: parseFloat(priceText)
        });
    });

    const orderData = {
        order_id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
        items: cartItems,
        total_amount: cartItems.reduce((sum, item) => sum + item.price, 0)
    };

    try {
        const response = await fetch('/create-receipt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
        });

        const result = await response.json();
        if (result.success) {
            alert('Order submitted successfully!');
        } else {
            alert('Failed to submit order.');
        }
    } catch (error) {
        console.error('Error submitting order:', error);
        alert('An error occurred while submitting the order.');
    }
}
</script>

</body>
</html>
