<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nizhal Crackers - Online Booking</title>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- jsPDF AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8ef;
      color: #20130d;
    }

    /* ================================
       HEADER
    ================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 1px solid #eadbca;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      color: #a50000;
      letter-spacing: .4px;
    }

    .tagline {
      font-size: 12px;
      color: #555;
      margin-top: 3px;
    }

    .cart {
      border: none;
      background: #128c7e;
      color: white;
      padding: 12px 18px;
      border-radius: 25px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ================================
       HERO
    ================================= */

    .hero {
      color: white;
      background:
        linear-gradient(
          135deg,
          #620000,
          #b00000,
          #e85d04,
          #ff8c00
        );
    }

    .hero-inner {
      max-width: 1200px;
      margin: auto;
      padding: 48px 18px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 64px);
      font-weight: 900;
    }

    .hero p {
      font-size: 17px;
      margin-top: 12px;
    }

    /* ================================
       MAIN
    ================================= */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 18px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .search {
      flex: 1;
      min-width: 220px;
      padding: 14px;
      border: 1px solid #e5d2bd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .unit-select {
      padding: 14px;
      border: 1px solid #e5d2bd;
      border-radius: 10px;
      background: white;
    }

    .status {
      color: #765f50;
      font-size: 13px;
      margin-bottom: 10px;
    }

    /* ================================
       PRODUCT GRID & CONTROLS
    ================================= */

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(215px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      border: 1px solid #eadbca;
      border-radius: 15px;
      padding: 14px;
      box-shadow:
        0 3px 10px rgba(100, 30, 0, .06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .discount-badge {
      display: inline-block;
      align-self: flex-start;
      background: #d00000;
      color: white;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 900;
    }

    .product-name {
      font-size: 17px;
      font-weight: 900;
      margin: 12px 0 8px;
      min-height: 40px;
    }

    .product-unit {
      font-size: 12px;
      color: #76665c;
    }

    .mrp {
      color: #888;
      text-decoration: line-through;
      font-size: 13px;
      margin-top: 4px;
    }

    .price {
      font-size: 21px;
      font-weight: 900;
      margin: 6px 0 12px;
      color: #1e120d;
    }

    .add-button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #a80000;
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    .add-button:hover {
      background: #790000;
    }

    /* Main Page (+ / -) Quantity Control Styling */
    .card-qty-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fdf3e7;
      border: 1px solid #e2cbb5;
      border-radius: 9px;
      padding: 4px;
      width: 100%;
    }

    .card-qty-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: #a80000;
      color: white;
      border-radius: 6px;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-qty-btn:hover {
      background: #790000;
    }

    .card-qty-count {
      font-size: 16px;
      font-weight: 900;
      color: #20130d;
    }

    /* ================================
       DRAWER
    ================================= */

    .drawer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
    }

    .drawer.open {
      display: block;
    }

    .shade {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.55);
    }

    .panel {
      position: absolute;
      top: 0;
      right: 0;
      width: min(480px, 100%);
      height: 100%;
      background: white;
      overflow-y: auto;
      padding: 18px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eadbca;
      padding-bottom: 10px;
    }

    .panel-head h2 {
      margin: 0;
    }

    .close-button {
      border: 1px solid #ccc;
      background: white;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
    }

    .cart-item {
      padding: 13px 0;
      border-bottom: 1px solid #eadbca;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-name {
      font-weight: 900;
      font-size: 15px;
    }

    .cart-info {
      color: #76665c;
      font-size: 12px;
      margin-top: 4px;
    }

    .cart-item-price {
      font-weight: 900;
      font-size: 15px;
      color: #a80000;
      text-align: right;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      font-size: 23px;
      font-weight: 900;
      padding: 18px 0;
    }

    .field {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 9px;
      font-size: 15px;
      outline: none;
    }

    textarea.field {
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #25d366;
      color: #073b1a;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
    }

    .download-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    .note {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .card {
        padding: 10px;
      }

      .product-name {
        font-size: 15px;
      }

      .hero-inner {
        padding: 35px 15px;
      }
    }

    /* =====================================================
       PRODUCT IMAGES
    ===================================================== */

    .product-image-box {
      width: 100%;
      height: 190px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      margin: 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* =====================================================
       CUSTOMER ORDER HISTORY
    ===================================================== */

    .history-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .history-overlay.show {
      display: flex;
    }

    .history-box {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .history-head h2 {
      margin: 0;
    }

    .history-close {
      border: none;
      background: #222;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 900;
    }

    .history-search {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .history-search input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    .history-search button {
      border: none;
      border-radius: 9px;
      padding: 0 16px;
      background: #222;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .history-status {
      color: #666;
      font-size: 13px;
      margin: 8px 0;
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">
      <div class="logo">NIZHAL CRACKERS</div>
      <div class="tagline">Online Booking</div>
    </div>

    <div style="display:flex;gap:8px;align-items:center;">
      <button class="cart" onclick="openOrderHistory()">My Orders</button>
      <button class="cart" onclick="openCart()">Cart <span id="count">0</span></button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Nizhal Crackers</h1>
    Mobile : 89038 71174
    <p>Select your crackers and place your order through online.</p>
  </div>
</section>

<main>
  <div class="toolbar">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search products..."
      oninput="renderProducts()"
    >

    <select
      id="unitSelect"
      class="unit-select"
      onchange="renderProducts()"
    >
      <option value="">All Units</option>
    </select>
  </div>

  <div id="status" class="status">Loading products...</div>
  <div id="grid" class="grid"></div>
</main>

<!-- CART DRAWER -->
<div id="drawer" class="drawer">
  <div class="shade" onclick="closeCart()"></div>
  <aside class="panel">
    <div class="panel-head">
      <h2>Order Summary</h2>
      <button class="close-button" onclick="closeCart()">X</button>
    </div>

    <div id="cartItems"></div>
    <p id="emptyCart" class="note">Your cart is empty.</p>

    <div id="orderForm" style="display:none">
      <div class="total-box">
        <span>Total</span>
        <span id="cartTotal">Rs.0.00</span>
      </div>

      <input id="customerName" class="field" type="text" placeholder="Customer Name *">
      <input id="customerPhone" class="field" type="tel" placeholder="Mobile Number *">
      <textarea id="customerAddress" class="field" rows="4" placeholder="Delivery Address *"></textarea>

      <button id="submitButton" class="submit-button" onclick="submitOrder()">
        Confirm order
      </button>

      <button id="downloadButton" class="download-button" onclick="makePDF(true)">
        Download PDF Receipt
      </button>
    </div>
  </aside>
</div>

<!-- CUSTOMER ORDER HISTORY -->
<div id="orderHistoryOverlay" class="history-overlay" onclick="closeOrderHistory(event)">
  <div class="history-box" onclick="event.stopPropagation()">
    <div class="history-head">
      <h2>My Orders</h2>
      <button class="history-close" onclick="closeOrderHistory()">X</button>
    </div>

    <div class="history-search">
      <input id="historyPhone" type="tel" placeholder="Enter mobile number" maxlength="15">
      <button onclick="loadOrderHistory()">View Orders</button>
    </div>

    <div id="historyStatus" class="history-status">
      Enter the mobile number used for your order.
    </div>

    <div id="historyList"></div>
  </div>
</div>

<script>

const COMPANY_NAME = "NIZHAL CRACKERS";
const COMPANY_ADDRESS = "NO.2A THIRUTHANGAL,SIVAKASI,VIRUTHUNAGAR- 626 130";
const COMPANY_PHONE = "+91-8903871174";
const WHATSAPP_NUMBER = "918903871174";

// Sample fallback products if API call fails or file opened locally
const FALLBACK_PRODUCTS = [
  { id: "1", sno: 1, name: "10 cm Sparklers Electric", unit: "1 Box", mrp: 120, discount: 15, price: 102 },
  { id: "2", sno: 2, name: "10 cm Sparklers Color", unit: "1 Box", mrp: 130, discount: 15, price: 110 },
  { id: "3", sno: 3, name: "Ground Chakka Big", unit: "1 Box", mrp: 240, discount: 20, price: 192 },
  { id: "4", sno: 4, name: "Flower Pots Special", unit: "1 Box", mrp: 350, discount: 20, price: 280 },
  { id: "5", sno: 5, name: "7 Shot Rockets", unit: "1 Box", mrp: 400, discount: 10, price: 360 }
];

function getDisplayProductName(product) {
  return String(product?.name || "").trim();
}

let products = [];

function getProductImage(product) {
  const sno = Number(product.sno || product.id || 0);
  if (!sno || sno < 1 || sno > 197) return "";
  const number = sno < 100 ? String(sno).padStart(2, "0") : String(sno);
  return `products/${number}.png`;
}

let cart = JSON.parse(localStorage.getItem("nizhalCrackersCart") || "{}");

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function loadProducts() {
  const status = document.getElementById("status");
  try {
    let data;
    const response = await fetch("/api/products", { cache: "no-store" }).catch(() => null);
    
    if (response && response.ok) {
      data = await response.json();
    } else {
      console.warn("API load failed or local file accessed. Using fallback data.");
      data = FALLBACK_PRODUCTS;
    }

    if (!Array.isArray(data) || !data.length) {
      data = FALLBACK_PRODUCTS;
    }

    products = data.map((product, index) => ({
      ...product,
      id: String(product.id ?? index + 1),
      sno: Number(product.sno ?? index + 1),
      name: String(product.name ?? ""),
      unit: String(product.unit ?? ""),
      mrp: Number(product.mrp ?? 0),
      discount: Number(product.discount ?? 0),
      price: Number(product.price ?? 0)
    }));

    Object.keys(cart).forEach(id => {
      if (!products.some(p => String(p.id) === String(id))) {
        delete cart[id];
      }
    });

    saveCart();
    buildUnits();
    renderProducts();
    status.textContent = products.length + " products loaded successfully.";
  } catch (error) {
    console.error(error);
    status.textContent = "Error loading products.";
  }
}

function buildUnits() {
  const select = document.getElementById("unitSelect");
  const units = [...new Set(products.map(p => p.unit).filter(Boolean))];

  select.innerHTML = '<option value="">All Units</option>';
  units.forEach(unit => {
    const option = document.createElement("option");
    option.value = unit;
    option.textContent = unit;
    select.appendChild(option);
  });
}

function renderProducts() {
  const grid = document.getElementById("grid");
  const search = String(document.getElementById("search").value || "").toLowerCase().trim();
  const selectedUnit = document.getElementById("unitSelect").value;

  const filtered = products.filter(product => {
    const matchesSearch = !search ||
      product.name.toLowerCase().includes(search) ||
      getDisplayProductName(product).toLowerCase().includes(search);
    const matchesUnit = !selectedUnit || product.unit === selectedUnit;
    return matchesSearch && matchesUnit;
  });

  if (!filtered.length) {
    grid.innerHTML = "<p>No products found.</p>";
    updateCart();
    return;
  }

  grid.innerHTML = filtered.map(product => {
    const discountText = product.discount > 0 ? `${product.discount}% OFF` : "SPECIAL";
    const pid = String(product.id).replace(/'/g, "\\'");
    const currentQty = Number(cart[product.id]) || 0;

    // Render + / - controls if quantity > 0, otherwise show Add button (ON INDEX PAGE ONLY)
    const actionControls = currentQty > 0 ? `
      <div class="card-qty-controls">
        <button class="card-qty-btn" onclick="changeQuantity('${pid}', -1)">-</button>
        <span class="card-qty-count">${currentQty}</span>
        <button class="card-qty-btn" onclick="changeQuantity('${pid}', 1)">+</button>
      </div>
    ` : `
      <button class="add-button" onclick="addToCart('${pid}')">
        + Add to Cart
      </button>
    `;

    return `
      <div class="card">
        <div>
          <span class="discount-badge">${escapeHTML(discountText)}</span>
          <div class="product-image-box">
            <img
              src="${getProductImage(product)}"
              alt="${escapeHTML(getDisplayProductName(product))}"
              class="product-image"
              loading="lazy"
              onerror="this.style.display='none'"
            >
          </div>
          <div class="product-name">${escapeHTML(getDisplayProductName(product))}</div>
          <div class="product-unit">${escapeHTML(product.unit)}</div>
          <div class="mrp">MRP Rs.${Number(product.mrp || 0).toLocaleString("en-IN")}</div>
          <div class="price">Rs.${Number(product.price || 0).toLocaleString("en-IN")}</div>
        </div>
        ${actionControls}
      </div>
    `;
  }).join("");

  updateCart();
}

function addToCart(id) {
  id = String(id);
  const product = products.find(p => String(p.id) === id);
  if (!product) {
    alert("Product not found. Please refresh the page.");
    return;
  }
  cart[id] = (Number(cart[id]) || 0) + 1;
  saveCart();
  renderProducts();
}

function changeQuantity(id, amount) {
  id = String(id);
  cart[id] = (Number(cart[id]) || 0) + Number(amount);
  if (cart[id] <= 0) delete cart[id];
  saveCart();
  renderProducts();
}

function getCartItems() {
  return Object.entries(cart).map(([id, quantity]) => {
    const product = products.find(p => String(p.id) === String(id));
    if (!product) return null;
    return { product, quantity: Number(quantity) || 0 };
  }).filter(Boolean);
}

function getCartTotal() {
  return getCartItems().reduce((total, item) => total + (Number(item.product.price) || 0) * item.quantity, 0);
}

function saveCart() {
  localStorage.setItem("nizhalCrackersCart", JSON.stringify(cart));
}

function updateCart() {
  const items = getCartItems();
  const count = items.reduce((total, item) => total + item.quantity, 0);

  document.getElementById("count").textContent = count;
  document.getElementById("emptyCart").style.display = items.length ? "none" : "block";
  document.getElementById("orderForm").style.display = items.length ? "block" : "none";

  const container = document.getElementById("cartItems");
  
  // CART DRAWER: Clean Order Summary (No buttons here)
  container.innerHTML = items.map(item => {
    const p = item.product;
    const amount = p.price * item.quantity;
    return `
      <div class="cart-item">
        <div>
          <div class="cart-name">${escapeHTML(p.name)}</div>
          <div class="cart-info">
            ${escapeHTML(p.unit)} | Qty: <strong>${item.quantity}</strong> × Rs.${Number(p.price).toFixed(2)}
          </div>
        </div>
        <div class="cart-item-price">
          Rs.${amount.toFixed(2)}
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("cartTotal").textContent = "Rs." + getCartTotal().toFixed(2);
}

function openCart() {
  document.getElementById("drawer").classList.add("open");
  updateCart();
}

function closeCart() {
  document.getElementById("drawer").classList.remove("open");
}

function money(value) {
  return Number(value || 0).toLocaleString("en-IN", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function drawFirework(doc, x, y, radius) {
  doc.setDrawColor(255, 190, 0);
  doc.setLineWidth(0.5);

  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12;
    const x1 = x + Math.cos(angle) * radius * 0.25;
    const y1 = y + Math.sin(angle) * radius * 0.25;
    const x2 = x + Math.cos(angle) * radius;
    const y2 = y + Math.sin(angle) * radius;
    doc.line(x1, y1, x2, y2);
  }

  doc.setFillColor(255, 210, 20);
  doc.circle(x, y, 1.5, "F");
}

function drawPDFHeader(doc, pageNumber) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  doc.setFillColor(166, 0, 0);
  doc.rect(0, 0, pageWidth, 42, "F");

  doc.setFillColor(235, 91, 4);
  doc.rect(0, 38, pageWidth, 4, "F");

  drawFirework(doc, 20, 15, 11);
  drawFirework(doc, pageWidth - 20, 13, 9);

  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.text(COMPANY_NAME, 15, 15);

  doc.setFontSize(7.8);
  doc.setFont("helvetica", "normal");
  const addressLines = doc.splitTextToSize(COMPANY_ADDRESS, 115);
  doc.text(addressLines, 15, 22);

  doc.setFont("helvetica", "bold");
  doc.setFontSize(8);
  doc.text("CONTACT", pageWidth - 15, 12, { align: "right" });

  doc.setFontSize(10);
  doc.text(COMPANY_PHONE, pageWidth - 15, 19, { align: "right" });

  doc.setFontSize(8);
  doc.text("ORDER RECEIPT", pageWidth - 15, 27, { align: "right" });

  doc.setFontSize(7);
  doc.text("Page " + pageNumber, pageWidth - 15, pageHeight - 8, { align: "right" });
}

function drawPDFFooter(doc) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  doc.setDrawColor(220, 70, 0);
  doc.setLineWidth(0.5);
  doc.line(15, pageHeight - 15, pageWidth - 15, pageHeight - 15);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(7);
  doc.setTextColor(100, 70, 50);

  doc.text(COMPANY_NAME + " | " + COMPANY_PHONE, 15, pageHeight - 8);
  doc.text("Thank you for your order", pageWidth - 15, pageHeight - 8, { align: "right" });
}

function makePDF(saveFile = false) {
  if (typeof window.jspdf === "undefined") {
    alert("PDF library is not loaded. Please refresh the page.");
    return null;
  }

  const items = getCartItems();
  if (!items.length) {
    alert("Please add at least one product to the cart.");
    return null;
  }

  const customerName = document.getElementById("customerName").value.trim() || "-";
  const customerPhone = document.getElementById("customerPhone").value.trim() || "-";
  const deliveryAddress = document.getElementById("customerAddress").value.trim() || "-";

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: "a4"
  });

  const pageWidth = doc.internal.pageSize.getWidth();

  drawPDFHeader(doc, 1);

  doc.setFillColor(255, 244, 225);
  doc.roundedRect(15, 48, pageWidth - 30, 18, 4, 4, "F");

  doc.setTextColor(165, 0, 0);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(17);
  doc.text("ORDER RECEIPT", pageWidth / 2, 60, { align: "center" });

  const orderDate = new Date();
  const dateText = orderDate.toLocaleDateString("en-IN");
  const orderId = "NC" + orderDate.toISOString().replace(/\D/g, "").slice(0, 14);

  doc.setTextColor(60, 40, 30);
  doc.setFontSize(8);
  doc.setFont("helvetica", "bold");
  doc.text("ORDER ID: " + orderId, 17, 72);
  doc.text("DATE: " + dateText, pageWidth - 17, 72, { align: "right" });

  doc.setFont("helvetica", "normal");
  doc.text("Name: " + customerName, 17, 78);
  doc.text("Phone: " + customerPhone, 17, 83);
  
  const splitAddress = doc.splitTextToSize("Address: " + deliveryAddress, pageWidth - 34);
  doc.text(splitAddress, 17, 88);

  const startTableY = 88 + (splitAddress.length * 4);

  const tableRows = items.map((item, index) => {
    const p = item.product;
    const qty = item.quantity;
    const mrp = Number(p.mrp || 0);
    const price = Number(p.price || 0);
    const amount = price * qty;

    return [
      index + 1,
      p.name,
      p.unit,
      "Rs. " + money(mrp),
      "Rs. " + money(price),
      qty,
      "Rs. " + money(amount)
    ];
  });

  doc.autoTable({
    startY: startTableY,
    head: [["S.No", "Product Name", "Unit", "MRP", "Price", "Qty", "Amount"]],
    body: tableRows,
    margin: { left: 15, right: 15, top: 45, bottom: 20 },
    theme: "striped",
    headStyles: { fillColor: [166, 0, 0], textColor: [255, 255, 255], fontStyle: "bold" },
    didDrawPage: function(data) {
      drawPDFHeader(doc, data.pageNumber);
      drawPDFFooter(doc);
    }
  });

  const finalY = doc.lastAutoTable.finalY + 10;
  const grandTotal = getCartTotal();

  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(166, 0, 0);
  doc.text("Grand Total: Rs. " + money(grandTotal), pageWidth - 15, finalY, { align: "right" });

  if (saveFile) {
    doc.save(`${orderId}_Receipt.pdf`);
  }

  return doc;
}

async function submitOrder() {
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("customerAddress").value.trim();

  if (!name || !phone || !address) {
    alert("Please fill in all mandatory fields (*)");
    return;
  }

  const items = getCartItems();
  if (!items.length) {
    alert("Your cart is empty!");
    return;
  }

  const submitBtn = document.getElementById("submitButton");
  submitBtn.disabled = true;
  submitBtn.textContent = "Processing Order...";

  makePDF(true);

  let message = `*NEW ORDER - ${COMPANY_NAME}*\n`;
  message += `-------------------------\n`;
  message += `*Name:* ${name}\n`;
  message += `*Phone:* ${phone}\n`;
  message += `*Address:* ${address}\n\n`;
  message += `*ORDER ITEMS:*\n`;

  items.forEach((item, i) => {
    message += `${i + 1}. ${item.product.name} (${item.product.unit}) - ${item.quantity} x Rs.${item.product.price} = Rs.${item.product.price * item.quantity}\n`;
  });

  message += `\n*TOTAL AMOUNT:* Rs.${getCartTotal().toFixed(2)}`;

  const encodedUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;

  cart = {};
  saveCart();
  renderProducts();

  submitBtn.disabled = false;
  submitBtn.textContent = "Confirm order";

  alert("Order prepared! Redirecting to WhatsApp to send confirmation.");
  window.open(encodedUrl, "_blank");
  closeCart();
}

function openOrderHistory() {
  document.getElementById("orderHistoryOverlay").classList.add("show");
}

function closeOrderHistory(e) {
  if (!e || e.target.id === "orderHistoryOverlay" || e.target.classList.contains("history-close")) {
    document.getElementById("orderHistoryOverlay").classList.remove("show");
  }
}

function loadOrderHistory() {
  const phone = document.getElementById("historyPhone").value.trim();
  const status = document.getElementById("historyStatus");
  if (!phone) {
    status.textContent = "Please enter a valid phone number.";
    return;
  }
  status.textContent = "Searching orders for " + phone + "...";
}

window.addEventListener("DOMContentLoaded", loadProducts);

</script>
